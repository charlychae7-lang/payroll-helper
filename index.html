<style>
:root{--ink:#1c2a2f;--sub:#5d6d73;--line:#d5dde0;--bg:#f3f5f4;--card:#fff;--main:#0f5c5a;--main-soft:#e3efee;--input:#fff8dc;--warn:#9a4d00;--warn-bg:#fff1e0;--bad:#b3261e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif}
header{position:sticky;top:0;z-index:20;background:var(--main);color:#fff;padding:10px 20px 0}
.top{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
h1{font-size:18px;margin:0;margin-right:auto}
h2{font-size:16px;margin:0}
h3{font-size:14px;margin:14px 0 6px}
nav{display:flex;gap:2px;margin-top:10px;overflow-x:auto}
nav button{border:0;background:transparent;color:#cfe3e2;padding:9px 18px;font:inherit;cursor:pointer;border-radius:6px 6px 0 0;white-space:nowrap}
nav button[aria-selected=true]{background:var(--bg);color:var(--main);font-weight:700}
main{padding:18px 20px 60px;max-width:1500px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:14px}
.head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.head h2{margin-right:auto}
.hint{color:var(--sub);font-size:12.5px;margin:4px 0}
button.btn,label.btn{border:1px solid var(--main);background:#fff;color:var(--main);border-radius:6px;padding:6px 13px;font:inherit;cursor:pointer}
button.btn.primary{background:var(--main);color:#fff}
button.btn.danger{border-color:var(--bad);color:var(--bad)}
button.btn:disabled{opacity:.45;cursor:default}
header .btn{border-color:#fff}
header .month{display:flex;gap:6px;align-items:center}
header .month input{color:var(--ink);background:#fff;min-width:150px}
input,select{font:inherit;color:inherit;border:1px solid var(--line);border-radius:4px;padding:4px 6px;background:var(--input)}
input[type=checkbox]{width:16px;height:16px;vertical-align:middle}
input:disabled,select:disabled{background:#eef0f0;color:var(--sub)}
input:focus-visible,button:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #f0a53a;outline-offset:1px}
input.n{width:100px;text-align:right}
input.s{width:62px;text-align:right}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid var(--line);padding:5px 7px;text-align:center;white-space:nowrap}
th{background:var(--main-soft);font-weight:700;font-size:12.5px}
td.r{text-align:right;font-variant-numeric:tabular-nums}
td.l{text-align:left;white-space:normal}
tr.sum td{background:#f4f1e6;font-weight:700}
.sticky th:first-child,.sticky td:first-child{position:sticky;left:0;background:var(--card);z-index:1}
.sticky th:first-child{background:var(--main-soft)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:11px 14px}
.stat span{display:block;color:var(--sub);font-size:12px}
.stat b{font-size:20px;font-variant-numeric:tabular-nums}
.warns{background:var(--warn-bg);border:1px solid #efc58f;color:var(--warn);border-radius:8px;padding:10px 14px;margin-bottom:14px}
.warns ul{margin:4px 0 0;padding-left:18px}
.badge{border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700;background:#fff;color:var(--main)}
.badge.closed{background:#f0a53a;color:#2b1b00}
details.card>summary{cursor:pointer;font-weight:700}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:12px}
.form label{display:flex;flex-direction:column;font-size:12px;color:var(--sub);gap:2px}
.form label input,.form label select{font-size:14px;color:var(--ink);width:100%}
.months{display:flex;gap:10px;flex-wrap:wrap}
.cal{display:grid;grid-template-columns:repeat(7,minmax(86px,1fr));gap:4px;min-width:640px}
.cal .dow{text-align:center;font-size:12px;color:var(--sub)}
.day{border:1px solid var(--line);border-radius:5px;padding:3px 4px;display:flex;flex-direction:column;gap:2px}
.day.on{border-color:var(--main);background:var(--main-soft)}
.day b{font-size:12px}
.day.sun b{color:var(--bad)}
.day input{width:100%;padding:1px 4px;font-size:12.5px;text-align:right}
.title{text-align:center;font-size:19px;margin:2px 0 8px}
.meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px;font-size:13px}
.slip{background:#fff;border:1px solid var(--line);border-radius:8px;padding:24px;max-width:800px;margin:0 auto 14px}
.slip table{margin-bottom:10px;table-layout:fixed}
.slip td,.slip th{white-space:normal;word-break:keep-all;overflow-wrap:anywhere}
.slip .days td,.slip .days th{font-size:10.5px;padding:2px 1px;word-break:normal}
.slip .net td,.slip .net th{font-size:16px;background:#f4f1e6;font-weight:700}
.slip .net td:last-child{font-size:12px;font-weight:400}
dialog{border:0;border-radius:10px;padding:20px;max-width:440px;box-shadow:0 10px 40px #0005}
dialog p{white-space:pre-line;margin-top:0}
dialog .head{justify-content:flex-end;margin:0}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 18px;border-radius:6px;display:none;z-index:50}
nav button[data-tab=help]{margin-left:auto;border:1px solid #ffffff80;border-bottom:0}
.manual{max-width:900px;margin:0 auto}
.manual th,.manual td{white-space:normal;word-break:keep-all;overflow-wrap:anywhere}
.manual tbody th{width:150px}
.manual h2{margin-bottom:8px}
.manual p{margin:6px 0}
.manual ul,.manual ol{margin:6px 0;padding-left:22px}
.manual table{margin-top:6px}
@media screen and (max-width:640px){header{position:static;padding:10px 12px 0}main{padding:12px 10px 40px}} 
.months{margin-left:auto}
header .btn{background:transparent;color:#fff}

.mark{display:inline-block;background:#f0a53a;color:#2b1b00;border-radius:20px;padding:1px 10px;font-size:12px;font-weight:700}
#view{position:relative}
.slip,#view .card{position:relative;overflow:hidden}

.info{max-width:820px;margin:0 auto}
.info td,.info th{white-space:normal}
@media print{body>*{display:none!important}body::after{content:"체험판 화면은 인쇄할 수 없습니다. 정식판에서 출력할 수 있습니다.";display:block;padding:40px;font-size:18px}}
</style>
