const daysIn = ym => { const [y, m] = ym.split('-').map(Number); return new Date(Date.UTC(y, m, 0)).getUTCDate(); };
const dayNo = d => Math.round(Date.parse(d + 'T00:00:00Z') / 86400000);
const addMonths = (d, n) => {
  const [y, m, day] = d.split('-').map(Number);
  const first = new Date(Date.UTC(y, m - 1 + n, 1));
  const last = new Date(Date.UTC(y, m + n, 0)).getUTCDate();
  return `${first.getUTCFullYear()}-${pad(first.getUTCMonth() + 1)}-${pad(Math.min(day, last))}`;
};
const ageAt = (birth, date) => {
  if (!birth) return null;
  let a = Number(date.slice(0, 4)) - Number(birth.slice(0, 4));
  if (date.slice(5) < birth.slice(5)) a -= 1;
  return a;
};

function ratesFor(S, ym) {
  const list = [...S.rates].sort((a, b) => a.from.localeCompare(b.from));
  let r = list[0];
  for (const x of list) if (x.from <= ym) r = x;
  return r;
}

/** 근로소득 간이세액 (월 과세급여, 공제대상 가족수, 8~20세 자녀수) */
function simpleTax(amount, family, children) {
  if (amount < 770000) return 0;
  const fam = Math.max(1, family || 0);
  const col = Math.min(11, fam);
  let row = TAX.row10;
  if (amount < 10000000) {
    let lo = 0, hi = TAX.rows.length - 1;
    while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (TAX.rows[mid][0] <= amount / 1000) lo = mid; else hi = mid - 1; }
    row = TAX.rows[lo];
  }
  let v = row[col] - Math.max(0, fam - 11) * (row[10] - row[11]);
  if (amount > 10000000) {
    const band = TAX.over.filter(b => b[0] < amount).pop();
    v += band[1] + (amount - band[0]) * band[2] * band[3];
  }
  if (children > 0) v -= children === 1 ? CHILD.one : CHILD.two + Math.max(0, children - 2) * CHILD.extra;
  return floor10(Math.max(0, v));
}

/** 상용직 1명의 한 달 급여. 대상이 아니면 null */
function calcRegular(S, ym, e, input = {}) {
  const dim = daysIn(ym), start = ym + '-01', end = `${ym}-${pad(dim)}`;
  if (!e.name || (e.join && e.join > end) || (e.leave && e.leave < start)) return null;
  const R = ratesFor(S, ym), B = S.bonus, month = Number(ym.slice(5));
  const from = e.join && e.join > start ? e.join : start;
  const to = e.leave && e.leave < end ? e.leave : end;
  const span = dayNo(to) - dayNo(from) + 1;
  const days = has(input.days) ? Math.max(0, Math.min(num(input.days), dim)) : span;
  const part = days < dim;
  const pro = v => part ? floorWon(num(v) * days / dim) : num(v);
  const base = pro(e.base), meal = pro(e.meal), car = pro(e.car), fixed = pro(e.fixed);
  const extra = num(input.extra);

  const bonusPct = has(e.bonusPct) ? num(e.bonusPct) : num(B.annualPct);
  let bonus = 0, bonusAuto = false;
  if (has(input.bonus)) bonus = num(input.bonus);
  else if (B.enabled && e.bonusOn && B.months.includes(month)) {
    const std = num(e.base) + (B.base === 'baseFixed' ? num(e.fixed) : 0);
    let v = std * bonusPct / 100 / B.months.length;
    if (B.prorate && part) v = v * days / dim;
    bonus = floor10(v);
    bonusAuto = true;
  }
  const vac = has(input.vac) ? num(input.vac) : (month === Number(S.vacationMonth) ? num(e.vacation) : 0);

  const total = base + meal + car + fixed + extra + bonus + vac;
  const nontax = Math.min(meal, R.mealLimit) + Math.min(car, R.carLimit);
  const taxable = total - nontax;
  const regular = taxable - bonus - vac;   // 상여·휴가비를 뺀 이번 달 과세급여

  const npBase = regular <= 0 ? 0 : Math.min(Math.max(Math.floor((num(e.npBase) > 0 ? num(e.npBase) : regular) / 1000) * 1000, R.npMin), R.npMax);
  const hiBase = regular <= 0 ? 0 : (num(e.hiBase) > 0 ? num(e.hiBase) : regular);
  const pick = (key, auto) => has(input[key]) ? num(input[key]) : auto;
  const np = pick('np', e.np ? floor10(npBase * R.np) : 0);
  const hi = pick('hi', e.hi ? floor10(hiBase * R.health) : 0);
  const ltc = pick('ltc', floor10(hi * R.ltc / (R.health * 2)));
  const ei = pick('ei', e.ei ? floor10(Math.max(taxable, 0) * R.emp) : 0);

  const family = num(e.family), kids = num(e.children);
  const special = bonus + vac;
  const n = Math.max(1, Math.min(12, Math.round(num(B.periodMonths)) || 1));
  let taxAuto, taxNote = `간이세액표 가족 ${Math.max(1, family)}명` + (kids > 0 ? `, 자녀공제 ${kids}명` : '');
  if (special > 0 && B.taxMode === 'period') {
    const avg = (regular * n + special) / n;
    taxAuto = floor10(Math.max(0, simpleTax(avg, family, kids) * n - simpleTax(regular, family, kids) * (n - 1)));
    taxNote = `상여 지급대상기간 ${n}개월 평균 방식 (${taxNote})`;
  } else {
    taxAuto = simpleTax(taxable, family, kids);
  }
  const tax = pick('tax', taxAuto);
  const local = floor10(tax * 0.1);
  const adjTax = num(input.adjTax);                       // 연말정산: 추가징수 +, 환급 −
  const adjLocal = Math.sign(adjTax) * floor10(Math.abs(adjTax) * 0.1);
  const other = num(input.other);
  const deduct = np + hi + ltc + ei + tax + local + adjTax + adjLocal + other;

  const dayText = part ? ` × ${days}일/${dim}일` : '';
  const how = (key, applied, text) => has(input[key]) ? '직접 입력 (고지·지원·정산)' : applied ? text : '적용 제외';
  const won = v => v.toLocaleString('ko-KR');
  const pct = (v, d) => (v * 100).toFixed(d) + '%';
  const pays = [
    ['기본급', base, part ? `월 ${won(num(e.base))}${dayText}` : '월 기본급'],
    ['식대', meal, meal ? `비과세 한도 월 ${won(R.mealLimit)}${dayText}` : ''],
    ['자가운전보조금', car, car ? `비과세 한도 월 ${won(R.carLimit)}${dayText}` : ''],
    ['고정수당', fixed, fixed ? (e.fixedNote || '월 고정수당') + dayText : ''],
    ['추가수당', extra, extra ? (input.extraNote || '') : ''],
    ['상여금', bonus, !bonus ? '' : bonusAuto ? `${B.base === 'baseFixed' ? '기본급+고정수당' : '기본급'} × 연 ${bonusPct}% ÷ ${B.months.length}회${B.prorate && part ? dayText : ''}` : '직접 입력'],
    ['휴가비', vac, vac ? (has(input.vac) ? '직접 입력' : `${S.vacationMonth}월 지급분`) : ''],
  ];
  const deducts = [
    ['국민연금', np, how('np', e.np, `${won(npBase)} × ${pct(R.np, 2)}`)],
    ['건강보험', hi, how('hi', e.hi, `${won(hiBase)} × ${pct(R.health, 3)}`)],
    ['장기요양보험', ltc, how('ltc', hi > 0, `건강보험료 × ${pct(R.ltc / (R.health * 2), 2)}`)],
    ['고용보험', ei, how('ei', e.ei, `과세 ${won(taxable)} × ${pct(R.emp, 1)}`)],
    ['소득세', tax, has(input.tax) ? '직접 입력' : taxNote],
    ['지방소득세', local, '소득세 × 10%'],
    ['연말정산 소득세', adjTax, adjTax ? (adjTax < 0 ? '환급' : '추가 징수') : ''],
    ['연말정산 지방소득세', adjLocal, adjLocal ? '정산 소득세 × 10%' : ''],
    ['기타공제', other, other ? (input.otherNote || '') : ''],
  ];

  const warn = [];
  const age = ageAt(e.birth, end);
  const isCeo = /대표/.test(e.rank || '');
  if (!num(e.base)) warn.push('기본급이 비어 있습니다.');
  if (total - deduct < 0) warn.push('실수령액이 음수입니다.');
  if (!e.birth) warn.push('생년월일이 없습니다. (명세서에 직원을 특정하는 정보가 필요합니다)');
  if (!isCeo && num(e.base) && (num(e.base) + num(e.fixed) + num(e.meal)) / 209 < R.minWage) warn.push(`최저임금(시급 ${won(R.minWage)}원, 월 209시간) 미달인지 확인하세요.`);
  if (isCeo && e.ei) warn.push('대표자는 보통 고용보험 적용 대상이 아닙니다.');
  if (age !== null && age >= 60 && e.np) warn.push('만 60세 이상입니다. 국민연금 적용 여부를 확인하세요.');
  if (age !== null && age >= 65 && e.ei) warn.push('만 65세 이상입니다. 고용보험(실업급여) 적용 여부를 확인하세요.');
  if (meal > R.mealLimit || car > R.carLimit) warn.push('비과세 한도 초과분은 과세로 계산했습니다.');

  return {type: 'regular', id: e.id, name: e.name, rank: e.rank || '', birth: e.birth || '', join: e.join || '', leave: e.leave || '',
    bank: e.bank || '', account: e.account || '', holder: e.holder || '', days, dim, base, meal, car, fixed, extra, bonus, vac,
    etc: car + fixed + extra + bonus + vac, total, nontax, taxable, np, hi, ltc, ei, tax, local, adj: adjTax + adjLocal + other,
    deduct, net: total - deduct, pays, deducts, warn};
}

/** 이 근로자의 최초 근로일 (직접 입력 우선, 없으면 출력 기록의 가장 이른 날) */
function firstWorkDate(S, w) {
  if (w.firstDate) return w.firstDate;
  let first = '';
  for (const ym of Object.keys(S.months).sort()) {
    const att = S.months[ym].daily?.[w.id]?.att || {};
    const ds = Object.keys(att).filter(d => num(att[d].u) > 0 || num(att[d].x) > 0).map(Number).sort((a, b) => a - b);
    if (ds.length) { first = `${ym}-${pad(ds[0])}`; break; }
  }
  return first;
}

/** 일용직 1명의 한 달 지급분. 출역이 없으면 null */
function calcDaily(S, ym, w, input = {}) {
  const R = ratesFor(S, ym), dim = daysIn(ym);
  const wage = has(input.wage) ? num(input.wage) : num(w.wage);
  const list = [];
  for (let d = 1; d <= dim; d++) {
    const a = input.att?.[d];
    if (!a) continue;
    const units = Math.max(0, num(a.u)), add = num(a.x);
    if (!units && !add) continue;
    list.push({d, units, add, pay: floorWon(wage * units) + add});
  }
  if (!w.name || !list.length) return null;

  const total = list.reduce((s, x) => s + x.pay, 0);
  const units = list.reduce((s, x) => s + x.units, 0);
  const days = list.length;
  const rawTax = p => Math.max(0, p - DAILY.deduct) * DAILY.rate * (1 - DAILY.credit);
  const payMode = w.payMode || 'lump';
  let taxAuto = 0, localAuto = 0;
  if (payMode === 'daily') {
    for (const x of list) {
      let t = floor10(rawTax(x.pay));
      if (t < DAILY.minTax) t = 0;
      taxAuto += t; localAuto += floor10(t * 0.1);
    }
  } else {
    taxAuto = floor10(list.reduce((s, x) => s + rawTax(x.pay), 0));
    if (taxAuto < DAILY.minTax) taxAuto = 0;
    localAuto = floor10(taxAuto * 0.1);
  }

  const first = firstWorkDate(S, w);
  const lastWorked = `${ym}-${pad(list[list.length - 1].d)}`;
  const oneMonth = !!first && dayNo(lastWorked) >= dayNo(addMonths(first, 1)) - 1;
  const age = ageAt(w.birth, `${ym}-${pad(dim)}`);
  const npAuto = oneMonth && (days >= 8 || total >= R.dailyNpIncome) && !(age !== null && age >= 60);
  const hiAuto = oneMonth && days >= 8;
  const mode = (key, auto) => { const m = input[key + 'Mode'] || w[key] || 'auto'; return m === 'auto' ? auto : m === 'Y'; };
  const npOn = mode('np', npAuto), hiOn = mode('hi', hiAuto), eiOn = w.ei !== 'N';
  const pick = (key, auto) => has(input[key]) ? num(input[key]) : auto;
  const npBase = Math.min(Math.max(Math.floor(total / 1000) * 1000, R.npMin), R.npMax);
  const np = pick('np', npOn ? floor10(npBase * R.np) : 0);
  const hi = pick('hi', hiOn ? floor10(total * R.health) : 0);
  const ltc = pick('ltc', floor10(hi * R.ltc / (R.health * 2)));
  const ei = pick('ei', eiOn ? floor10(total * R.emp) : 0);
  const tax = pick('tax', taxAuto);
  const local = has(input.tax) ? floor10(tax * 0.1) : localAuto;
  const other = num(input.other);
  const deduct = np + hi + ltc + ei + tax + local + other;

  const won = v => v.toLocaleString('ko-KR');
  const pct = (v, d) => (v * 100).toFixed(d) + '%';
  const how = (key, on, text) => has(input[key]) ? '직접 입력' : on ? text : '적용 제외';
  const addSum = list.reduce((s, x) => s + x.add, 0);
  const pays = [
    ['노임', total - addSum, `일급 ${won(wage)} × ${units}공수`],
    ['추가수당', addSum, addSum ? (input.addNote || '일자별 추가 지급') : ''],
  ];
  const deducts = [
    ['국민연금', np, how('np', npOn, `${won(npBase)} × ${pct(R.np, 2)}`)],
    ['건강보험', hi, how('hi', hiOn, `${won(total)} × ${pct(R.health, 3)}`)],
    ['장기요양보험', ltc, how('ltc', hi > 0, `건강보험료 × ${pct(R.ltc / (R.health * 2), 2)}`)],
    ['고용보험', ei, how('ei', eiOn, `${won(total)} × ${pct(R.emp, 1)}`)],
    ['소득세', tax, has(input.tax) ? '직접 입력' : `(일급 − 15만원) × 6% × 45%, ${payMode === 'daily' ? '일별' : '지급액 합계'} 1,000원 미만 미징수`],
    ['지방소득세', local, '소득세 × 10%'],
    ['기타공제', other, other ? (input.otherNote || '') : ''],
  ];

  const warn = [];
  if (!wage) warn.push('일급이 비어 있습니다.');
  if (wage && wage / 8 < R.minWage) warn.push(`일급이 최저임금(8시간 ${won(R.minWage * 8)}원)보다 적습니다.`);
  if (!w.birth) warn.push('생년월일이 없습니다.');
  if (!oneMonth && days >= 8) warn.push('8일 이상 일했지만 근로 시작 후 1개월 전입니다. 계속 근로하면 국민연금·건강보험 가입 대상인지 확인하세요.');
  if (npOn || hiOn) warn.push('국민연금·건강보험 가입 대상으로 계산했습니다. 취득신고 여부를 확인하세요.');
  if (first && lastWorked >= addMonths(first, 3)) warn.push('최초 근로 후 3개월 이상입니다. 세법상 상용근로자 해당 여부(건설업은 1년 기준)를 확인하세요.');
  if (age !== null && age >= 65 && eiOn) warn.push('만 65세 이상입니다. 고용보험 적용 여부를 확인하세요.');
  if (total - deduct < 0) warn.push('실수령액이 음수입니다.');

  return {type: 'daily', id: w.id, name: w.name, rank: w.job || '', birth: w.birth || '', site: w.site || '', join: first,
    bank: w.bank || '', account: w.account || '', holder: w.holder || '', days, units, wage, list, total,
    np, hi, ltc, ei, tax, local, adj: other, deduct, net: total - deduct, pays, deducts, warn};
}

/* ───────── 엑셀(.xlsx) 만들기: 외부 라이브러리 없이 무압축 ZIP ───────── */
const CRC = Array.from({length: 256}, (_, n) => { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; return c >>> 0; });
const crc32 = b => { let c = 0xffffffff; for (const x of b) c = CRC[(c ^ x) & 255] ^ (c >>> 8); return (c ^ 0xffffffff) >>> 0; };

function zip(files, type = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet') {
  const enc = new TextEncoder(), parts = [], central = [];
  const le = (size, fields) => {
    const b = new Uint8Array(size), v = new DataView(b.buffer);
    for (const [off, val, len] of fields) len === 2 ? v.setUint16(off, val, true) : v.setUint32(off, val, true);
    return b;
  };
  let offset = 0;
  for (const [name, text] of files) {
    const n = enc.encode(name), d = typeof text === 'string' ? enc.encode(text) : text, c = crc32(d);
    const local = le(30, [[0, 0x04034b50], [4, 20, 2], [6, 0x0800, 2], [12, 0x21, 2], [14, c], [18, d.length], [22, d.length], [26, n.length, 2]]);
    central.push(le(46, [[0, 0x02014b50], [4, 20, 2], [6, 20, 2], [8, 0x0800, 2], [14, 0x21, 2], [16, c], [20, d.length], [24, d.length], [28, n.length, 2], [42, offset]]), n);
    parts.push(local, n, d);
    offset += 30 + n.length + d.length;
  }
  const size = central.reduce((s, x) => s + x.length, 0);
  const end = le(22, [[0, 0x06054b50], [8, files.length, 2], [10, files.length, 2], [12, size], [16, offset]]);
  return new Blob([...parts, ...central, end], {type});
}

const xml = s => String(s).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g, '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const colName = i => { let s = ''; for (i += 1; i > 0; i = Math.floor((i - 1) / 26)) s = String.fromCharCode(65 + (i - 1) % 26) + s; return s; };
/* 스타일 번호: 0 기본, 1 제목, 2 머리글, 3 글자칸, 4 금액칸, 5 합계금액, 6 합계글자 */
const cell = (v, s = 3, f) => ({v, s, f});

function sheetXml(sh) {
  const rows = sh.rows.map((row, r) => {
    const cells = row.map((c, i) => {
      if (c === null || c === undefined) return '';
      const ref = colName(i) + (r + 1);
      if (c.f) return `<c r="${ref}" s="${c.s}"><f>${xml(c.f)}</f><v>${c.v}</v></c>`;
      if (typeof c.v === 'number') return `<c r="${ref}" s="${c.s}"><v>${c.v}</v></c>`;
      return `<c r="${ref}" s="${c.s}" t="inlineStr"><is><t xml:space="preserve">${xml(c.v ?? '')}</t></is></c>`;
    }).join('');
    const h = sh.heights?.[r];
    return `<row r="${r + 1}"${h ? ` ht="${h}" customHeight="1"` : ''}>${cells}</row>`;
  }).join('');
  const cols = sh.widths.map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join('');
  const merges = sh.merges?.length ? `<mergeCells count="${sh.merges.length}">${sh.merges.map(m => `<mergeCell ref="${m}"/>`).join('')}</mergeCells>` : '';
  return `<?xml version="1.0" encoding="UTF-8"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetPr><pageSetUpPr fitToPage="1"/></sheetPr><cols>${cols}</cols><sheetData>${rows}</sheetData>${merges}<pageMargins left="0.4" right="0.4" top="0.6" bottom="0.6" header="0.3" footer="0.3"/><pageSetup paperSize="9" orientation="landscape" fitToWidth="1" fitToHeight="0"/></worksheet>`;
}

function buildXlsx(sheets) {
  const ns = 'http://schemas.openxmlformats.org';
  const head = '<?xml version="1.0" encoding="UTF-8"?>';
  const side = '<left style="thin"/><right style="thin"/><top style="thin"/><bottom style="thin"/><diagonal/>';
  const xf = (num_, font, fill, border, align) => `<xf numFmtId="${num_}" fontId="${font}" fillId="${fill}" borderId="${border}" xfId="0" applyNumberFormat="1" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment vertical="center" ${align}/></xf>`;
  const styles = `${head}<styleSheet xmlns="${ns}/spreadsheetml/2006/main"><fonts count="3"><font><sz val="10"/><name val="맑은 고딕"/></font><font><b/><sz val="16"/><name val="맑은 고딕"/></font><font><b/><sz val="10"/><name val="맑은 고딕"/></font></fonts><fills count="4"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFE3EFEE"/></patternFill></fill><fill><patternFill patternType="solid"><fgColor rgb="FFF4F1E6"/></patternFill></fill></fills><borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border><border>${side}</border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="7">${[

const KEY = 'payroll-helper-v1';

const rate = (from, np, npMin, npMax, ltc, minWage) => ({from, np, npMin, npMax, health: 0.03595, ltc, emp: 0.009, minWage, mealLimit: 200000, carLimit: 200000, dailyNpIncome: 2200000});
const defaults = () => ({
  version: 1,

  bonus: {enabled: true, annualPct: 200, months: [1, 4, 7, 9], base: 'base', prorate: true, taxMode: 'period', periodMonths: 3},
  vacationMonth: 7,
  rates: [
    rate('2026-01', 0.0475, 400000, 6370000, 0.009448, 10320),

});

/** 불러온 자료를 기본 구조에 맞춘다. 형식이 틀리면 오류 */
function normalize(d) {
  if (!d || d.version !== 1 || !Array.isArray(d.employees) || !Array.isArray(d.rates) || !d.rates.length || !d.months || typeof d.months !== 'object') throw new Error('급여앱 백업 파일이 아닙니다.');
  const base = defaults();
  const s = {...base, ...d, company: {...base.company, ...d.company}, bonus: {...base.bonus, ...d.bonus}};
  if (!Array.isArray(s.workers)) s.workers = [];
  const safeId = x => /^[A-Za-z0-9_-]+$/.test(x?.id || '');
  if (![...s.employees, ...s.workers].every(safeId)) throw new Error('직원 번호 형식이 올바르지 않습니다.');
  return s;
}

let S, loadError = '';
try {
  const raw = localStorage.getItem(KEY);
  S = raw ? normalize(JSON.parse(raw)) : defaults();
} catch (err) {
  loadError = String(err.message || err);
  S = defaults();
}

let saveBlocked = !!loadError;   // 읽지 못한 저장 자료는 덮어쓰지 않는다
function save() {
  if (saveBlocked) { toast('저장된 자료를 읽지 못해 자동 저장을 멈췄습니다. 설정에서 백업을 불러오세요.'); return; }
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch { toast('저장하지 못했습니다. 지금 [백업 저장]을 눌러 파일로 보관하세요.'); }
}

const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const won = v => Number(v || 0).toLocaleString('ko-KR');

const monthData = (key = ym) => {

};
const peek = (key = ym) => S.months[key] || {inputs: {}, daily: {}};
const isClosed = () => !!peek().closed;
const nextYm = key => addMonths(key + '-01', 1).slice(0, 7);
const defaultPayDate = (key = ym) => { const n = nextYm(key); return `${n}-${pad(Math.min(Math.max(num(S.company.payDay), 1), daysIn(n)))}`; };

/** 해당 월 계산 결과. 마감한 달은 저장해 둔 금액을 그대로 쓴다 */
function results(key = ym) {
  const m = peek(key);
  if (m.closed && m.snapshot) return m.snapshot;
  return {
    company: S.company.name,
    payDate: m.payDate || defaultPayDate(key),
    dailyPayDate: m.dailyPayDate || m.payDate || defaultPayDate(key),
    regular: S.employees.map(e => calcRegular(S, key, e, m.inputs?.[e.id])).filter(Boolean),
    daily: S.workers.map(w => calcDaily(S, key, w, m.daily?.[w.id])).filter(Boolean),
  };
}
const totals = rows => rows.reduce((t, r) => { for (const k of ['base', 'meal', 'etc', 'total', 'np', 'hi', 'ltc', 'ei', 'tax', 'local', 'adj', 'deduct', 'net', 'days', 'units']) t[k] = (t[k] || 0) + (r[k] || 0); return t; }, {});

function toast(msg) {
  const t = $('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.style.display = 'none', 3500);
}

/* 입력칸: data-p = 저장 위치(점으로 구분), data-t = 값 종류 */

/* ───────── 직원별 명세서 PDF ───────── */
const joinBytes = list => { const out = new Uint8Array(list.reduce((s, a) => s + a.length, 0)); let p = 0; for (const a of list) { out.set(a, p); p += a.length; } return out; };

/** JPEG 그림 한 장을 A4 한 쪽짜리 PDF로 만든다 */
function imagePdf(jpeg, width, height) {
  const enc = new TextEncoder();
  const stream = (dict, data) => [enc.encode(`<< ${dict} /Length ${data.length} >>\nstream\n`), data, enc.encode('\nendstream')];
  const objects = [
    [enc.encode('<< /Type /Catalog /Pages 2 0 R >>')],
    [enc.encode('<< /Type /Pages /Kids [3 0 R] /Count 1 >>')],
    [enc.encode('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>')],
    stream(`/Type /XObject /Subtype /Image /Width ${width} /Height ${height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode`, jpeg),
    stream('', enc.encode('q\n595.28 0 0 841.89 0 0 cm\n/Im0 Do\nQ\n')),
  ];
  const parts = [enc.encode('%PDF-1.4\n'), new Uint8Array([37, 226, 227, 207, 211, 10])];
  let offset = parts[0].length + parts[1].length;
  const offsets = [];
  objects.forEach((body, i) => {
    const chunk = joinBytes([enc.encode(`${i + 1} 0 obj\n`), ...body, enc.encode('\nendobj\n')]);
    offsets.push(offset); offset += chunk.length; parts.push(chunk);
  });
  parts.push(enc.encode(`xref\n0 ${objects.length + 1}\n0000000000 65535 f \n${offsets.map(o => String(o).padStart(10, '0') + ' 00000 n \n').join('')}trailer\n<< /Size ${objects.length + 1} /Root 1 0 R >>\nstartxref\n${offset}\n%%EOF\n`));
  return joinBytes(parts);
}

/* ── 명세서 그리기 (A4, 화면 명세서와 같은 항목) ── */
const PAGE = {w: 794, h: 1123, m: 40};
function paintSlip(ctx, r, res) {
  const [y, mo] = ym.split('-').map(Number), daily = r.type === 'daily';
  const X = PAGE.m, W = PAGE.w - PAGE.m * 2;
  let top = PAGE.m;
  const font = (size, bold) => `${bold ? 'bold ' : ''}${size}px "Malgun Gothic","Apple SD Gothic Neo",sans-serif`;
  const wrap = (value, width) => {
    const lines = [''];
    for (const ch of String(value ?? '')) {
      const last = lines.length - 1;
      if (lines[last] && ctx.measureText(lines[last] + ch).width > width) lines.push(ch.trim()); else lines[last] += ch;
    }
    return lines;
  };
  /* cells: [글, 폭비율, {a: 정렬, b: 굵게, f: 배경, s: 글자크기}] */
  const row = (cells, min = 24) => {
    const laid = cells.map(([value, ratio, o = {}]) => {
      const w = W * ratio, size = o.s || 12.5;
      ctx.font = font(size, o.b);
      return {w, size, o, lines: wrap(value, w - 8)};
    });
    const h = Math.max(min, ...laid.map(c => c.lines.length * c.size * 1.35 + 8));
    let x = X;
    for (const c of laid) {
      if (c.o.f) { ctx.fillStyle = c.o.f; ctx.fillRect(x, top, c.w, h); }
      ctx.strokeStyle = '#555'; ctx.lineWidth = 0.7; ctx.strokeRect(x, top, c.w, h);
      ctx.fillStyle = '#111'; ctx.font = font(c.size, c.o.b); ctx.textBaseline = 'middle';
      ctx.textAlign = c.o.a || 'center';
      const tx = ctx.textAlign === 'right' ? x + c.w - 6 : ctx.textAlign === 'left' ? x + 6 : x + c.w / 2;
      const first = top + h / 2 - (c.lines.length - 1) * c.size * 1.35 / 2;
      c.lines.forEach((t, i) => ctx.fillText(t, tx, first + i * c.size * 1.35));
      x += c.w;
    }
    top += h;
  };
  const center = (value, size, bold, h) => { ctx.fillStyle = '#111'; ctx.font = font(size, bold); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(value, PAGE.w / 2, top + h / 2); top += h; };
  const H = {f: '#e3efee', b: true}, SUM = {f: '#f4f1e6', b: true};

  center(`${y}년 ${mo}월 ${daily ? '일용근로 임금명세서' : '급여명세서'}`, 22, true, 44);
  const info = (a, b, c, d) => row([[a, .18, H], [b, .32], [c, .18, H], [d, .32]]);
  info('회 사 명', res.company, '지 급 일', daily ? res.dailyPayDate : res.payDate);
  info('성    명', `${r.name} ${r.rank}`, '생년월일', r.birth);
  info(daily ? '현 장 명' : '입 사 일', daily ? r.site : r.join, '귀속기간', `${ym}-01 ~ ${ym}-${daysIn(ym)}`);
  info('근로일수', `${r.days}일`, daily ? '총 공수' : '과세대상금액', daily ? String(r.units) : won(r.taxable) + '원');
  top += 12;
  const head = label => row([[label, .22, H], ['금액(원)', .18, H], ['계산 방법', .6, H]]);
  const item = ([name, value, how]) => row([[name, .22, H], [won(value), .18, {a: 'right'}], [how, .6, {a: 'left', s: 11.5}]]);
  const total = (label, value) => row([[label, .22, SUM], [won(value), .18, {...SUM, a: 'right'}], ['', .6, SUM]]);
  head('지급 항목'); r.pays.filter((p, n) => p[1] || n === 0).forEach(item); total('지급액 합계', r.total);
  head('공제 항목'); r.deducts.filter((d, n) => d[1] || n < 6).forEach(item); total('공제액 합계', r.deduct);
  row([['실 지급액', .22, {...SUM, s: 15}], [won(r.net), .18, {...SUM, a: 'right', s: 15}], ['지급액 합계 − 공제액 합계', .6, {f: '#f4f1e6'}]], 34);
  if (daily) {
    top += 12;
    for (let n = 0; n < r.list.length; n += 11) {
      const chunk = r.list.slice(n, n + 11);
      const line = (label, f) => row([[label, .12, {...H, s: 10.5}], ...Array.from({length: 11}, (_, i) => [chunk[i] ? f(chunk[i]) : '', .08, {s: 10}])], 19);
      line('근로일', x => `${x.d}일`); line('공수', x => String(x.units)); line('지급액', x => won(x.pay));
    }
  }
  top += 8;
  center(`귀하의 노고에 감사드립니다.  ${res.company}`, 12.5, false, 28);
  return top;
}

async function slipJpeg(r, res) {
  const SCALE = 2, canvas = document.createElement('canvas');
  canvas.width = PAGE.w * SCALE; canvas.height = PAGE.h * SCALE;
  const ctx = canvas.getContext('2d');
  const white = () => { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, PAGE.w, PAGE.h); };
  ctx.scale(SCALE, SCALE);
  const end = paintSlip(ctx, r, res);          // 첫 번째는 높이 확인용
  const fit = Math.min(1, (PAGE.h - PAGE.m * 2) / (end - PAGE.m));
  white();
  ctx.translate(PAGE.w * (1 - fit) / 2, PAGE.m * (1 - fit));
  ctx.scale(fit, fit);
  paintSlip(ctx, r, res);
  const blob = await new Promise((done, fail) => canvas.toBlob(b => b ? done(b) : fail(new Error('그림을 만들지 못했습니다.')), 'image/jpeg', 0.92));
  return {bytes: new Uint8Array(await blob.arrayBuffer()), width: canvas.width, height: canvas.height};
}

/* ── 대상, 파일 이름, 저장 ── */
const slipKey = r => r.type + ':' + r.id;
function slipFileName(r, all) {
  const clean = v => String(v).replace(/[\\/:*?"<>|\x00-\x1f]/g, '_').trim() || '이름없음';
  const same = all.filter(x => x.type === r.type && x.name === r.name);
  const no = same.length > 1 ? `_${same.findIndex(x => x.id === r.id) + 1}` : '';
  return `${ym}_급여명세서_${clean(r.name)}${r.type === 'daily' ? '_일용' : ''}${no}.pdf`;
}

let pdfBusy = false;
/** 메일 발송 도구가 읽는 수신자 목록 (엑셀에서도 열리도록 BOM 포함) */
function mailList(rows, all, res) {
  const quote = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const lines = [['연월', '회사', '구분', '성명', '이메일', '파일'],
    ...rows.map(r => [ym, res.company, r.type === 'daily' ? '일용' : '상용', r.name, emailOf(r), slipFileName(r, all)])];
  return String.fromCharCode(0xfeff) + lines.map(l => l.map(quote).join(',')).join('\r\n') + '\r\n';
}
const emailOf = r => String((r.type === 'daily' ? S.workers : S.employees).find(x => x.id === r.id)?.email || '').trim();

async function makePdfs(keys, forMail = false) {
  if (pdfBusy) return;
  const res = results(), all = [...res.regular, ...res.daily];
  const chosen = all.filter(r => keys.includes(slipKey(r)));
  if (!chosen.length) return;
  const run = async () => {
    pdfBusy = true;
    try {
      const files = [];
      for (const [n, r] of chosen.entries()) {
        toast(`PDF 만드는 중 ${n + 1}/${chosen.length}`);
        const img = await slipJpeg(r, res);
        files.push([slipFileName(r, all), imagePdf(img.bytes, img.width, img.height)]);
      }
      if (forMail) {
        files.push(['발송목록.csv', mailList(chosen, all, res)]);
        download(zip(files, 'application/zip'), `급여명세서_${ym}_메일발송.zip`);
        const none = chosen.filter(r => !emailOf(r)).map(r => r.name);
        toast(`메일 발송용 파일을 저장했습니다.${none.length ? ' 이메일 없음: ' + none.join(', ') : ''}`);
      } else {
        if (files.length === 1) download(new Blob([files[0][1]], {type: 'application/pdf'}), files[0][0]);
        else download(zip(files, 'application/zip'), `급여명세서_${ym}_PDF.zip`);
        toast(`${files.length}명의 PDF를 저장했습니다.`);
      }
    } catch (err) { toast('PDF를 만들지 못했습니다: ' + err.message); }
    finally { pdfBusy = false; }
  };
  if (!isClosed()) ask(`${chosen.length}명의 PDF를 만들까요?\n아직 마감 전이라 금액이 바뀔 수 있습니다.`, run); else await run();
}

async function copyMessage(key) {
  const res = results(), r = [...res.regular, ...res.daily].find(x => slipKey(x) === key);
  if (!r) return;
  const [y, mo] = ym.split('-').map(Number);
  const message = `[${res.company}] ${r.name}님, ${y}년 ${mo}월 급여명세서를 보내 드립니다.\n확인 후 문의 사항은 담당자에게 알려 주세요.`;
  try { await navigator.clipboard.writeText(message); }
  catch {
    const box = document.createElement('textarea');
    box.value = message; document.body.append(box); box.select();
    const copied = document.execCommand('copy'); box.remove();
    if (!copied) { toast('복사하지 못했습니다.'); return; }
  }
  toast(`${r.name}님 안내 문구를 복사했습니다.`);
}

function setPath(path, value) {
  const keys = path.split('.');
  if (keys[0] === 'months') monthData(keys[1]);
  let o = S;
  for (const k of keys.slice(0, -1)) o = o[k] ||= {};
  o[keys[keys.length - 1]] = value;
}

function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function ledgerSheet(res) {
  const [y, mo] = ym.split('-').map(Number), rows = res.regular, first = 7, last = first + rows.length - 1;
  const H = v => cell(v, 2), blank = n => Array.from({length: n}, () => H(''));
  const data = rows.map((r, n) => {
    const x = first + n;
    return [cell(n + 1), cell(r.name), cell(r.join + (r.leave ? ` (${r.leave})` : '')), cell(r.rank), cell(r.base, 4), cell(r.meal, 4), cell(r.etc, 4),
      cell(r.total, 4, `SUM(E${x}:G${x})`), ...[r.np, r.hi, r.ltc, r.ei, r.tax, r.local, r.adj].map(v => cell(v, 4)),
      cell(r.deduct, 4, `SUM(I${x}:O${x})`), cell(r.net, 4, `H${x}-P${x}`)];
  });
  const t = totals(rows), keys = ['base', 'meal', 'etc', 'total', 'np', 'hi', 'ltc', 'ei', 'tax', 'local', 'adj', 'deduct', 'net'];
  const sum = [cell('합 계', 6), cell('', 6), cell('', 6), cell('', 6), ...keys.map((k, n) => cell(t[k] || 0, 5, rows.length ? `SUM(${colName(4 + n)}${first}:${colName(4 + n)}${last})` : undefined))];
  return {name: '급여대장', widths: [6, 11, 13, 10, 12, 10, 11, 12, 10, 10, 10, 10, 10, 9, 10, 11, 13], heights: {0: 28},
    merges: ['A1:Q1', 'A3:H3', 'M3:Q3', 'A5:A6', 'B5:B6', 'C5:C6', 'D5:D6', 'E5:H5', 'I5:P5', 'Q5:Q6', `A${last + 1}:D${last + 1}`],
    rows: [[cell(`${res.company} 급여대장 (${y}년 ${mo}월)`, 1)], [], [cell(`급여기간 ${ym}-01 ~ ${ym}-${daysIn(ym)}`, 0), null, null, null, null, null, null, null, null, null, null, null, cell(`급여지급일 ${res.payDate}`, 0)], [],
      [H('구분'), H('성명'), H('입사일 (퇴사일)'), H('직급'), H('임 금 액'), ...blank(3), H('공 제 내 역'), ...blank(7), H('실 수령액')],
      [...blank(4), ...['기본급', '식대', '기타수당', '급여계', '국민연금', '건강보험', '장기요양', '고용보험', '소득세', '주민세', '정산·기타', '공제계'].map(H), H('')],
      ...data, sum]};
}
function exportXlsx() {
  const res = results(), sheets = [ledgerSheet(res)];
  const table = (name, heads, widths, rows) => ({name, widths, rows: [heads.map(h => cell(h, 2)), ...rows.map(r => r.map(v => cell(v, typeof v === 'number' ? 4 : 3)))]});
  if (res.daily.length) sheets.push(table('일용노무비', ['성명', '생년월일', '직종', '현장', '근로일', '일수', '공수', '일급', '노임계', '국민연금', '건강보험', '장기요양', '고용보험', '소득세', '주민세', '기타', '공제계', '실지급액'],
    [11, 12, 10, 14, 30, 6, 6, 11, 12, 10, 10, 10, 10, 9, 9, 9, 11, 12],
    res.daily.map(r => [r.name, r.birth, r.rank, r.site, r.list.map(x => `${x.d}(${x.units})`).join(', '), r.days, r.units, r.wage, r.total, r.np, r.hi, r.ltc, r.ei, r.tax, r.local, r.adj, r.deduct, r.net])));
  const all = [...res.regular, ...res.daily];
  sheets.push(table('명세내역', ['구분', '성명', '항목', '금액', '계산 방법'], [8, 11, 20, 13, 60],
    all.flatMap(r => [...r.pays.map(p => ['지급', r.name, ...p]), ...r.deducts.map(d => ['공제', r.name, ...d])].filter(x => x[3]))));
  sheets.push(table('이체목록', ['성명', '은행', '계좌번호', '예금주', '이체금액', '지급일'], [11, 12, 22, 11, 14, 13],
    all.map(r => [r.name, r.bank, r.account, r.holder, r.net, r.type === 'daily' ? res.dailyPayDate : res.payDate])));
  download(buildXlsx(sheets), `급여_${ym}.xlsx`);
  toast('엑셀 파일을 내려받았습니다.');
}

  sample: () => {
    if (S.employees.length || S.workers.length) return;
    [['예시직원1', '대표', 4000000], ['예시직원2', '과장', 3300000], ['예시직원3', '사원', 2600000]].forEach(([name, rank, base], n) => {
      const e = emp('sample' + n, name, rank, '1990-01-01', '2024-01-02', 1, 0, rank !== '대표');
      e.base = base; e.meal = 200000; S.employees.push(e);
    });
    S.company.name = '예시 회사';
    commit(); toast('예시 자료를 넣었습니다. 지우려면 설정·백업의 [처음 상태로 되돌리기]를 누르세요.');
  },
  mailPack: () => makePdfs([...document.querySelectorAll('[data-act="pdfOne"]')].map(b => b.dataset.id), true),
  addEmp: () => { const id = newId('e'); S.employees.push(emp(id, '', '', '', '', 1, 0, true)); openCards.add('e-' + id); commit(); },
  delEmp: id => { const e = S.employees.find(x => x.id === id); ask(`${e.name || '새 직원'} 정보를 삭제할까요?\n마감하지 않은 달에서 사라집니다. 퇴사자는 퇴사일을 입력하는 편이 안전합니다.`, () => { S.employees = S.employees.filter(x => x.id !== id); commit(); }); },
  addWorker: () => { const id = newId('w'); S.workers.push({id, name: '', birth: '', job: '', site: '', wage: 0, firstDate: '', payMode: 'lump', np: 'auto', hi: 'auto', ei: 'Y', bank: '', account: '', holder: '', email: ''}); openCards.add('w-' + id); commit(); },
  delWorker: id => { const w = S.workers.find(x => x.id === id); ask(`${w.name || '새 근로자'}을(를) 삭제할까요?\n마감하지 않은 달의 출역 내역도 계산에서 빠집니다.`, () => { S.workers = S.workers.filter(x => x.id !== id); commit(); }); },
  fillWeek: id => {
    const i = monthData().daily[id] ||= {}; i.att ||= {};
    const [y, mo] = ym.split('-').map(Number);
    for (let d = 1; d <= daysIn(ym); d++) { const dow = new Date(Date.UTC(y, mo - 1, d)).getUTCDay(); if (dow > 0 && dow < 6 && !has(i.att[d]?.u)) (i.att[d] ||= {}).u = '1'; }
    commit(); toast('평일을 채웠습니다. 공휴일과 쉰 날은 지워 주세요.');
  },
  clearAtt: id => ask(`${ym} 출역 입력을 지울까요?`, () => { const i = monthData().daily[id]; if (i) delete i.att; commit(); }),
  addRate: () => {
    const last = [...S.rates].sort((a, b) => a.from.localeCompare(b.from)).pop();
    S.rates.push({...last, from: nextYm(last.from > ym ? last.from : ym)}); commit();
  },
  delRate: n => ask('이 요율 줄을 삭제할까요?', () => { S.rates.splice(Number(n), 1); commit(); }),
  resetAll: () => ask('모든 입력 자료를 지우고 처음 상태로 되돌릴까요?\n되돌릴 수 없으니 먼저 백업 파일을 저장하세요.', () => { S = defaults(); saveBlocked = false; loadError = ''; commit(); }),
};

document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-tab]');
  if (t) { tab = t.dataset.tab; window.scrollTo(0, 0); return render(); }
  const b = ev.target.closest('[data-act]');
  if (b) ACTIONS[b.dataset.act](b.dataset.id);
});
document.addEventListener('toggle', ev => {
  const k = ev.target.dataset?.card;
  if (k) ev.target.open ? openCards.add(k) : openCards.delete(k);
}, true);
let pointerDown = false, renderPending = false;
const scheduleRender = () => { if (pointerDown) renderPending = true; else setTimeout(render, 0); };
document.addEventListener('pointerdown', () => pointerDown = true, true);
for (const type of ['pointerup', 'pointercancel']) document.addEventListener(type, () => {
  pointerDown = false;
  if (renderPending) { renderPending = false; setTimeout(render, 0); }
}, true);
document.addEventListener('focusout', ev => {
  if (ev.target.dataset?.dirty) { delete ev.target.dataset.dirty; scheduleRender(); }
});
document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.id === 'month') { if (el.value) ym = el.value; return render(); }
  if (el.id === 'slipPick') { slipPick = el.value; return render(); }
  if (el.id === 'restore') {
    const file = el.files[0];
    if (!file) return;
    return file.text().then(txt => {
      const data = normalize(JSON.parse(txt));
      ask(`'${file.name}' 백업을 불러올까요?\n지금 저장된 자료를 모두 바꿉니다.`, () => { S = data; saveBlocked = false; loadError = ''; commit(); toast('백업을 불러왔습니다.'); });
    }).catch(err => toast('불러오지 못했습니다: ' + err.message)).finally(() => el.value = '');
  }
  if (el.dataset.bonusMonth) {
    const n = Number(el.dataset.bonusMonth), set = new Set(S.bonus.months);
    el.checked ? set.add(n) : set.delete(n);
    S.bonus.months = [...set].sort((a, b) => a - b);
  } else if (el.dataset.p) {
    const type = el.dataset.t, raw = el.value.trim();
    let v = el.value;
    if (type === 'bool') v = el.checked;
    else if (type === 'money') {
      if (raw && !/^-?[\d,]+(\.\d+)?$/.test(raw)) { toast('숫자만 입력하세요.'); return render(); }
      v = raw ? num(raw) : '';
    } else if (type === 'pct') v = num(raw) / 100;
    if (el.dataset.p.endsWith('.from') && !v) return render();
    setPath(el.dataset.p, v);
  } else return;
  save();
  if (el.type === 'date' || el.type === 'month') el.dataset.dirty = '1';   // 날짜는 칸을 벗어난 뒤 반영
  else scheduleRender();   // Tab 키로 옮겨 간 칸의 초점을 유지
});
render();

</script>
</body>
</html>
